
name: SecureOpShip CI

# Trigger the workflow on pushes and pull requests targeting main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Grant only read access to repository contents.
permissions:
  contents: read

jobs:
  ci:
    name: Application Quality and Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Stage 1: Retrieve repository source code.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stage 2: Configure Python.
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Stage 3: Install project dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Stage 4: Run code quality checks.
      - name: Run Ruff
        run: python -m ruff check .

      # Stage 5: Execute automated tests.
      - name: Run pytest
        run: python -m pytest -v

      # Stage 6: Perform source-code security analysis.
      - name: Run Bandit
        run: python -m bandit -r app/

      # Stage 7: Audit third-party dependencies.
      - name: Run pip-audit
        run: python -m pip_audit